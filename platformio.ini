; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
; Собирать по умолчанию только основное окружение: дополнительные (power_test)
; выбираются явно через -e, иначе `pio run` собирал бы все и CI-гард размера
; получал бы несколько отчётов сразу.
default_envs = ch32v003f4p6_evt_r0

[env:ch32v003f4p6_evt_r0]
platform = ch32v
board = ch32v003f4p6_evt_r0
framework = noneos-sdk
monitor_speed = 115200
board_build.use_lto = yes
build_src_filter = +<src/> +<examples/basic/>
; Пример собран с маской «только 4 направления» (UP/DOWN/LEFT/RIGHT):
; Z-ось (Forward/Backward), вращение (CW/CCW) и WAVE отключены и в регистрах
; масок прерываний 0x41/0x42, и в программном фильтре драйвера
; (read_gesture_flags() вырезает эти биты из прочитанных 0x43/0x44), поэтому
; посторонние жесты не могут перебить направление. Дополнительно при
; PAJ_WAVE_MASK=0 и PAJ_PS_MASK=0 драйвер не читает второй байт 0x44 —
; на один I2C-обмен меньше на каждый опрос.
; Вернуть все жесты: PAJ_GESTURE_MASK=PAJ_GESMASK_ALL и PAJ_WAVE_MASK=1.
build_flags =
    -Isrc
    -DPAJ_GESTURE_MASK=0x0F
    -DPAJ_WAVE_MASK=0
lib_deps =
    https://github.com/tama18101971/I2C-CH32V003.git#v7.1.0

; ---------------------------------------------------------------------------
; Диагностика питания (не собирается по умолчанию).
;
;   pio run -e power_test -t upload
;
; После инициализации датчик переводится в suspend (ИК-светодиод погашен,
; потребление ≈15 мкА), I2C больше не используется, в UART печатается только
; "alive N" каждые 500 мс.
;   * сбросы прекратились  -> виновато питание/ток датчика;
;   * сбросы продолжаются  -> МК, NRST или WCH-Link, датчик ни при чём.
; ---------------------------------------------------------------------------
[env:power_test]
platform = ch32v
board = ch32v003f4p6_evt_r0
framework = noneos-sdk
monitor_speed = 115200
board_build.use_lto = yes
build_src_filter = +<src/> +<examples/basic/>
build_flags =
    -Isrc
    -DPAJ_GESTURE_MASK=0x0F
    -DPAJ_WAVE_MASK=0
    -DPAJ_EXAMPLE_POWER_TEST=1
lib_deps =
    https://github.com/tama18101971/I2C-CH32V003.git#v7.1.0
